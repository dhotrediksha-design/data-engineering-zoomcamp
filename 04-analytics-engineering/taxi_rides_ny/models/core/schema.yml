models:
  - name: dim_zones
    description: >
      List of unique zones identified by locationid.
      Includes the service zone they corresponds to {Green and Yellow}.
    columns:
      - name: locationid
        data_type: int64
        description: ""

      - name: borough
        data_type: string
        description: ""

      - name: zone
        data_type: string
        description: ""

      - name: service_zone
        data_type: string
        description: ""
  - name: dm_monthly_zone_revenue
    description: >
      Aggregated table of all taxi trips corresposnding to both service names {Green and Yellow} per pickup zone , month and services.
      The table contain monthly sum of fare elements used to calculate montly revenue.
      The table also contains montly indicator like number of trips and average trip distance.
    columns:
      - name: revenue_month
        data_type: date
        description: ""

      - name: service_type
        data_type: string
        description: ""

      - name: revenue_monthly_fare
        data_type: numeric
        description: ""

      - name: revenue_monthly_extra
        data_type: numeric
        description: ""

      - name: revenue_monthly_mta_tax
        data_type: numeric
        description: ""

      - name: revenue_monthly_tip_amount
        data_type: numeric
        description: ""

      - name: revenue_monthly_tolls_amount
        data_type: numeric
        description: ""

      - name: revenue_monthly_improvement_surcharge
        data_type: numeric
        description: ""

      - name: revenue_monthly_total_amount
        data_type: numeric
        description: "Montly sum of total_amounts of fare charged for the trip per pickup_zone, month and service"

      - name: total_monthly_trips
        data_type: int64
        description: ""

      - name: avg_monthly_passenger_count
        data_type: float64
        description: ""

      - name: avg_monthly_trip_distance
        data_type: numeric
        description: ""